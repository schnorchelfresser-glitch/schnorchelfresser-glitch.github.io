<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Lumen Climber">
  <defs>
    <linearGradient id="trail" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0"    stop-color="#ff5d8f" stop-opacity="0"/>
      <stop offset="0.35" stop-color="#ff5d8f" stop-opacity="0.55"/>
      <stop offset="0.72" stop-color="#ffc24b" stop-opacity="0.85"/>
      <stop offset="1"    stop-color="#8ff6ec" stop-opacity="1"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0"   stop-color="#4be0d4" stop-opacity="0.85"/>
      <stop offset="0.45" stop-color="#4be0d4" stop-opacity="0.25"/>
      <stop offset="1"   stop-color="#4be0d4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bg" cx="0.5" cy="0.62" r="0.75">
      <stop offset="0"   stop-color="#241443"/>
      <stop offset="0.55" stop-color="#120b26"/>
      <stop offset="1"   stop-color="#07040f"/>
    </radialGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#cfe9ff"/>
    </linearGradient>
    <clipPath id="frame"><rect width="512" height="512" rx="116"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="512" height="512" fill="url(#bg)"/>

    <!-- stars -->
    <g fill="#ffffff">
      <circle cx="78"  cy="96"  r="2.4" opacity=".55"/>
      <circle cx="150" cy="58"  r="1.6" opacity=".35"/>
      <circle cx="404" cy="120" r="2.1" opacity=".45"/>
      <circle cx="452" cy="212" r="1.5" opacity=".3"/>
      <circle cx="60"  cy="250" r="1.7" opacity=".3"/>
      <circle cx="330" cy="52"  r="1.4" opacity=".3"/>
    </g>

    <!-- platforms: wider and dimmer as they recede downward -->
    <g>
      <rect x="60"  y="404" width="188" height="15" rx="7.5" fill="#2f7f86" opacity=".55"/>
      <rect x="250" y="330" width="168" height="15" rx="7.5" fill="#3a99a0" opacity=".7"/>
      <rect x="104" y="256" width="150" height="15" rx="7.5" fill="#48b9bd" opacity=".85"/>
      <rect x="286" y="182" width="126" height="15" rx="7.5" fill="#5fd9d3"/>
    </g>

    <!-- comet trail, tapering as it rises -->
    <path d="M104 452 C 168 424, 214 386, 258 330 C 300 276, 330 224, 352 168"
          fill="none" stroke="url(#trail)" stroke-width="34" stroke-linecap="round" opacity=".55"/>
    <path d="M104 452 C 168 424, 214 386, 258 330 C 300 276, 330 224, 352 168"
          fill="none" stroke="url(#trail)" stroke-width="13" stroke-linecap="round"/>

    <!-- the climber, at the head of the trail -->
    <circle cx="356" cy="150" r="86" fill="url(#halo)"/>
    <g transform="translate(356 150) rotate(20)">
      <ellipse rx="27" ry="35" fill="url(#body)"/>
      <rect x="-27" y="-7" width="54" height="13" rx="6.5" fill="#4be0d4"/>
      <ellipse cx="9" cy="-15" rx="9" ry="6.5" fill="#0a0612" opacity=".9"/>
    </g>

    <!-- the active bomb: the thing you climb for -->
    <g transform="translate(150 322)">
      <circle r="26" fill="#ffc24b" opacity=".18"/>
      <circle r="14" fill="#ffc24b"/>
      <circle r="6"  fill="#fff3d0"/>
      <rect x="-3" y="-22" width="6" height="10" rx="3" fill="#ffc24b"/>
    </g>
  </g>
</svg>
